<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 Proyectos IA — Marcos Cavalier</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c10;--surface:#111318;--border:#1e2330;--accent:#3b82f6;--gold:#f59e0b;--green:#10b981;--red:#ef4444;--orange:#f97316;--text:#e2e8f0;--muted:#64748b;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:linear-gradient(135deg,#0f1623,#0a0c10);border-bottom:1px solid var(--border);padding:18px 16px 14px;position:sticky;top:0;z-index:100;}
.header-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.header-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;}
.header-title span{color:var(--accent);}
.live{font-size:10px;display:flex;align-items:center;gap:5px;color:var(--muted);border:1px solid var(--border);padding:3px 8px;border-radius:20px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center;}
.sv{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;}
.sl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.blue{color:var(--accent);}.green{color:var(--green);}.red{color:var(--red);}.orange{color:var(--orange);}
input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-family:'DM Mono',monospace;font-size:12px;color:var(--text);outline:none;margin-bottom:8px;}
input:focus{border-color:var(--accent);}
.tabs{display:flex;gap:6px;margin-bottom:8px;}
.tab{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .2s;text-align:center;}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.filters{display:flex;gap:6px;flex-wrap:wrap;}
.fb{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;}
.fb.active{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.1);}
main{padding:14px;display:flex;flex-direction:column;gap:10px;}
.card{border-radius:12px;border:1px solid var(--border);background:var(--surface);overflow:hidden;transition:border-color .2s;}
.card.cdone{border-color:rgba(16,185,129,.25);background:rgba(16,185,129,.05);}
.card.cblock{border-color:rgba(239,68,68,.3);}
.ch{padding:14px 16px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;}
.ci{font-size:18px;flex-shrink:0;margin-top:1px;}
.cb{flex:1;min-width:0;}
.ct{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin-bottom:6px;line-height:1.3;}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
.badge{font-size:9px;padding:2px 8px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase;font-weight:600;border:1px solid;}
.b-done{color:var(--green);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.1);}
.b-cur{color:var(--accent);border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.1);}
.b-blk{color:var(--red);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.1);}
.b-alert{color:var(--orange);border-color:rgba(249,115,22,.3);background:rgba(249,115,22,.1);}
.b-over{color:var(--red);border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.15);}
.dates{display:flex;gap:12px;font-size:10px;color:var(--muted);margin-bottom:8px;}
.pw{display:flex;align-items:center;gap:8px;}
.pb{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.pf{height:100%;border-radius:2px;transition:width .5s;}
.pf.low{background:var(--red);}.pf.mid{background:var(--gold);}.pf.hi{background:var(--green);}
.pt{font-size:10px;color:var(--muted);white-space:nowrap;}
.chev{font-size:14px;color:var(--muted);transition:transform .2s;flex-shrink:0;margin-top:2px;}
.chev.open{transform:rotate(180deg);}
.subs{border-top:1px solid var(--border);padding:10px 16px 14px;display:none;}
.subs.open{display:block;}
.sub-label{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
.sub{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid rgba(30,35,48,.5);cursor:pointer;}
.sub:last-child{border-bottom:none;}
.chk{width:16px;height:16px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .2s;}
.chk.done{background:var(--green);border-color:var(--green);}
.chk.done::after{content:'✓';font-size:9px;color:#fff;}
.st{font-size:12px;color:var(--text);line-height:1.4;}
.st.done{color:var(--muted);text-decoration:line-through;}
.empty{text-align:center;padding:50px;color:var(--muted);font-size:12px;letter-spacing:1px;}
footer{text-align:center;padding:20px;font-size:10px;color:var(--muted);letter-spacing:1px;border-top:1px solid var(--border);margin-top:10px;}
footer a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<header>
  <div class="header-label">Coordinador SST — UNIQUE S.A.</div>
  <div class="header-row">
    <div class="header-title">🤖 Proyectos <span>IA</span></div>
    <div class="live"><div class="dot"></div>EN LÍNEA</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="sv blue" id="s1">—</div><div class="sl">Total</div></div>
    <div class="stat"><div class="sv blue" id="s2">—</div><div class="sl">En curso</div></div>
    <div class="stat"><div class="sv green" id="s3">—</div><div class="sl">Completados</div></div>
    <div class="stat"><div class="sv red" id="s4">—</div><div class="sl">Alertas</div></div>
  </div>
  <input id="search" placeholder="🔍 buscar proyecto..." oninput="render()"/>
  <div class="tabs">
    <button class="tab active" id="tp" onclick="setTab('p')">🔄 En curso</button>
    <button class="tab" id="td" onclick="setTab('d')">✅ Completados</button>
  </div>
  <div class="filters" id="flt">
    <button class="fb active" onclick="setF('all',this)">Todos</button>
    <button class="fb" onclick="setF('alert',this)">⚠️ Alertas</button>
    <button class="fb" onclick="setF('block',this)">🔴 Bloqueados</button>
  </div>
</header>
<main id="main"></main>
<footer>Marcos Cavalier Jara · UNIQUE S.A. · Lima, Perú · <a href="https://docs.google.com/spreadsheets/d/1PqwctL-IfxsQfZtZsUmqLHoj5tipl0GNWIMKZfVCm00" target="_blank">📊 Ver Sheet</a></footer>

<script>
// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════

      {t:"Caso ROOTS — Informe CN-ROOTS-005",d:true},
      {t:"Master Transfer Prompt generado",d:true}]},
    {id:"c4",title:"Documentos Operativos Varios",subtasks:[
      {t:"Informe accidente SSI-FOR-001 (Milagros Sinche / Taxi Directo)",d:true},
      {t:"Declaración robo laptop (Maricruz Garrido, Piura)",d:true},
      {t:"Correo SYNCRO con observaciones formales",d:true}]}
  ],
  pendientes: [
    {id:"p1",title:"Ronda Camelias — Sistema de Patrullaje Digital",status:"En curso",due:"2026-06-20",alert:"2026-06-13",subtasks:[
      {t:"App agente (Netlify)",d:true},{t:"Dashboard coordinador (Netlify)",d:true},
      {t:"Backend Supabase (tablas + storage)",d:true},
      {t:"Mover correlativo de localStorage a Supabase",d:false},
      {t:"Integrar Turno Noche al sistema",d:false}]},
    {id:"p2",title:"CAPACITRACK — Asistencia Digital SST",status:"Bloqueado",due:"2026-07-15",alert:"2026-07-07",subtasks:[
      {t:"Flujo A — Generación QR dinámico",d:true},{t:"Flujo B — Registro de asistencia + hash",d:true},
      {t:"Flujo C — Generación de planilla Word (bloqueado)",d:false},
      {t:"Escalar a otros países (Colombia, Ecuador, Bolivia, Venezuela, México)",d:false}]},
    {id:"p3",title:"PESV v1.0 — Plan Estratégico de Seguridad Vial",status:"En curso",due:"2026-06-30",alert:"2026-06-23",subtasks:[
      {t:"Documento Word SSI-PESV-001",d:true},{t:"One-pager HTML ejecutivo",d:true},
      {t:"Registro incidentes INC-001 y RPTACCI-001",d:true},

    {id:"p4",title:"Monitoreo de Higiene Ocupacional",status:"En curso",due:"2026-07-15",alert:"2026-07-08",subtasks:[
      {t:"One-pager HTML presentación para Katia Santos",d:true},
      {t:"Emails directores y colaboradores",d:true},
      {t:"Coordinación SGS Perú / RÍMAC — semana 26–29 may",d:true},
      {t:"Recibir informe final del proveedor SGS Perú",d:false}]},
    {id:"p5",title:"SDAI Lurín — Sistema de detección de incendios",status:"En curso",due:"2026-06-25",alert:"2026-06-18",subtasks:[
      {t:"86+ observaciones clasificadas (CRÍTICA/MAYOR/MENOR)",d:true},
      {t:"Correo formal a SYNCRO",d:true},{t:"Guía de verificación de campo",d:true},
      {t:"Regenerar Informe Word final",d:false},
      {t:"Regenerar Matriz Excel de observaciones",d:false},
      {t:"Levantar OB-002 crítica (agente limpio vs diluvio)",d:false}]},
    {id:"p6",title:"Mava Kids — Catálogo + Plan Exploralandia",status:"En curso",due:"2026-07-31",alert:"2026-07-15",subtasks:[
      {t:"catalogo-mavakids.html con branding y TikTok links",d:true},
      {t:"PDF estratégico B2B Exploralandia (confidencial)",d:true},
      {t:"Roadmap automatización 3 fases",d:true},
      {t:"Feedback de la responsable de Mava Kids",d:false},
      {t:"Ejecutar negociación con directora Exploralandia",d:false},
      {t:"Activar Fase 1 automatización (ManyChat / Kommo)",d:false}]},
    {id:"p7",title:"GDR XXIV Lima Sur — Área de Gestión de Riesgos",status:"En curso",due:"2026-07-31",alert:"2026-07-15",subtasks:[
      {t:"11 documentos operativos entregados",d:true},

      {t:"Recibir feedback del equipo GDR sobre el planeamiento",d:false}]},
    {id:"p8",title:"Informe de Seguridad Diario — Workflow desde PDF",status:"En curso",due:"2026-07-10",alert:"2026-06-30",subtasks:[
      {t:"Mapa HTML operativo estilo alerta construido",d:true},
      {t:"Estructura de zonas, corredores y callouts definida",d:true},
      {t:"Definir fuente diaria de PDF de noticias",d:false},
      {t:"Estructurar prompt de extracción y análisis",d:false},
      {t:"Semi-automatizar el flujo de actualización diaria",d:false}]},
    {id:"p9",title:"Radar de Riesgos — Plataforma SaaS",status:"En curso",due:"2026-08-31",alert:"2026-08-01",subtasks:[
      {t:"App de juego SST Day (16 participantes, 6 escenarios)",d:true},
      {t:"Módulo 1 iniciado (generador IA Claude Vision API + Canvas)",d:true},
      {t:"Módulo 2 — Gestión multi-empresa de escenarios",d:false},
      {t:"Módulo 3 — Leaderboard y reportes por empresa",d:false},
      {t:"Postular Premio Excelencia en Prevención RÍMAC 2026",d:false}]},
    {id:"p10",title:"SEGURIDAD HUMANA — SaaS inteligencia corporativa",status:"En curso",due:"2026-09-30",alert:"2026-09-01",subtasks:[
      {t:"Arquitectura desplegada (Render.com + GitHub Pages)",d:true},
      {t:"APScheduler configurado (generación diaria Lima time)",d:true},
      {t:"Modelo optimizado (claude-haiku)",d:true},
      {t:"Definir pitch comercial vs Andrick Consultores",d:false},
      {t:"Conseguir primeros 3 clientes piloto",d:false},
      {t:"Dashboard de cliente finalizado",d:false}]},
    {id:"p11",title:"ITSE — Carpeta de Seguridad Física",status:"En curso",due:"2026-07-31",alert:"2026-07-15",subtasks:[
      {t:"Diseño completo de carpeta (pisos 5–6, identidad Yanbal)",d:true},
      {t:"Confirmar estado de implementación física actual",d:false},
      {t:"Actualizar documentos con cambios 2026",d:false},
      {t:"Presentar a INDECI si corresponde",d:false}]},
    {id:"p12",title:"Documentos Pendientes de Aprobación Corporativa — Yanbal",status:"En curso",due:"2026-07-31",alert:"2026-06-15",subtasks:[
      {t:"Plan de Emergencia redactado",d:true},
      {t:"Plan de Brigadas redactado",d:true},
      {t:"Procedimiento SSI-PRO-CON-001 redactado",d:true},
      {t:"Obtener aprobación corporativa de los 3 documentos",d:false},
      {t:"Implementar y difundir una vez aprobados",d:false}]},
    {id:"p13",title:"Plan de Carrera Profesional — Seguridad Corporativa Internacional",status:"En curso",due:"2026-09-30",alert:"2026-09-01",subtasks:[
      {t:"Informe ejecutivo de compensaciones y mercado laboral",d:true},
      {t:"Mapa mental Excalidraw del plan de carrera",d:true},
      {t:"Definir hoja de ruta de certificaciones (PSP → CPP → ISO 22301)",d:false},
      {t:"Mejorar nivel de inglés (meta B2 → C1)",d:false},
      {t:"Postular a posición internacional o multinacional en Perú",d:false}]}
  ]
};

let tab='p', filter='all', expanded={};

function isAlertSoon(a){if(!a)return false;const d=(new Date(a)-new Date())/86400000;return d>=0&&d<=7;}
function isOverdue(d){if(!d)return false;return new Date(d)<new Date();}
function fmtDate(d){if(!d)return'';const[y,m,day]=d.split('-');return`${day}/${m}/${y}`;}
function prog(subs){const done=subs.filter(s=>s.d).length;return{done,total:subs.length,pct:subs.length?Math.round(done/subs.length*100):0};}
function pcls(p){return p<40?'low':p<75?'mid':'hi';}

function setTab(t){
  tab=t;
  document.getElementById('tp').classList.toggle('active',t==='p');
  document.getElementById('td').classList.toggle('active',t==='d');
  document.getElementById('flt').style.display=t==='p'?'flex':'none';
  render();
}
function setF(f,el){
  filter=f;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');render();
}

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const pend=DATA.pendientes, done=DATA.completados;
  const alerts=pend.filter(p=>isAlertSoon(p.alert)||isOverdue(p.due));
  document.getElementById('s1').textContent=pend.length+done.length;
  document.getElementById('s2').textContent=pend.length;
  document.getElementById('s3').textContent=done.length;
  document.getElementById('s4').textContent=alerts.length;

  let list=tab==='p'?pend:done;
  if(q)list=list.filter(p=>p.title.toLowerCase().includes(q));
  if(tab==='p'){
    if(filter==='alert')list=list.filter(p=>isAlertSoon(p.alert)||isOverdue(p.due));
    if(filter==='block')list=list.filter(p=>p.status&&p.status.toLowerCase().includes('bloqueado'));
  }
  document.getElementById('main').innerHTML=list.length?list.map(cardHTML).join(''):'<div class="empty">— SIN RESULTADOS —</div>';
}

function cardHTML(p){
  const isDone=!p.due;
  const {done,total,pct}=prog(p.subtasks);
  const over=isOverdue(p.due), alert=isAlertSoon(p.alert);
  const isBlk=p.status&&p.status.toLowerCase().includes('bloqueado');
  const cc=isDone?'cdone':isBlk?'cblock':'';
  const icon=isDone?'✅':isBlk?'🔴':'🔄';
  const isOpen=expanded[p.id];
  return`<div class="card ${cc}" id="card-${p.id}">
  <div class="ch" onclick="toggleCard('${p.id}')">
    <div class="ci">${icon}</div>
    <div class="cb">
      <div class="ct">${p.title}</div>
      <div class="meta">
        ${isDone?'<span class="badge b-done">Completado</span>':isBlk?'<span class="badge b-blk">Bloqueado</span>':'<span class="badge b-cur">En curso</span>'}
        ${over?'<span class="badge b-over">⚠️ Vencido</span>':''}
        ${alert&&!over?'<span class="badge b-alert">🔔 Alerta</span>':''}
      </div>
      ${p.due?`<div class="dates"><span>📅 ${fmtDate(p.due)}</span>${p.alert?`<span>🔔 ${fmtDate(p.alert)}</span>`:''}</div>`:''}
      <div class="pw"><div class="pb"><div class="pf ${pcls(pct)}" style="width:${pct}%"></div></div><div class="pt">${done}/${total} (${pct}%)</div></div>
    </div>
    <div class="chev${isOpen?' open':''}" id="chev-${p.id}">⌄</div>
  </div>
  <div class="subs${isOpen?' open':''}" id="sub-${p.id}">
    <div class="sub-label">SUBTAREAS</div>
    ${p.subtasks.map((s,i)=>`<div class="sub" onclick="toggleSub('${p.id}',${i})"><div class="chk${s.d?' done':''}"></div><div class="st${s.d?' done':''}">${s.t}</div></div>`).join('')}
  </div>
</div>`;
}

function toggleCard(id){
  expanded[id]=!expanded[id];
  const sub=document.getElementById(`sub-${id}`);
  const chev=document.getElementById(`chev-${id}`);
  if(sub){sub.classList.toggle('open',expanded[id]);chev.classList.toggle('open',expanded[id]);}
}

function toggleSub(pid,idx){
  const src=tab==='p'?DATA.pendientes:DATA.completados;
  const p=src.find(x=>x.id===pid);
  if(!p)return;
  p.subtasks[idx].d=!p.subtasks[idx].d;
  const wasOpen=expanded[pid];
  render();
  if(wasOpen){expanded[pid]=true;const sub=document.getElementById(`sub-${pid}`);const chev=document.getElementById(`chev-${pid}`);if(sub){sub.classList.add('open');chev.classList.add('open');}}
}

render();
</script>
</body>
</html>
