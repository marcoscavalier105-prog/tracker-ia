<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 Proyectos IA — Marcos Cavalier</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --surface2: #181c24;
    --border: #1e2330;
    --accent: #3b82f6;
    --gold: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --orange: #f97316;
    --text: #e2e8f0;
    --muted: #64748b;
    --done-bg: rgba(16,185,129,0.08);
    --done-border: rgba(16,185,129,0.25);
    --pending-bg: rgba(59,130,246,0.08);
    --pending-border: rgba(59,130,246,0.25);
    --blocked-bg: rgba(239,68,68,0.08);
    --blocked-border: rgba(239,68,68,0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0f1623 0%, #0a0c10 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px 16px;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(20px);
  }
  .header-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 16px;
  }
  .header-label {
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 4px;
  }
  .header-title {
    font-family: 'Syne', sans-serif;
    font-size: 22px; font-weight: 800; color: var(--text);
    letter-spacing: -0.5px;
  }
  .header-title span { color: var(--accent); }
  .status-badge {
    font-size: 10px; padding: 4px 10px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
  }

  /* STATS */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; margin-bottom: 16px;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; text-align: center;
  }
  .stat-val {
    font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800;
    line-height: 1;
  }
  .stat-val.blue { color: var(--accent); }
  .stat-val.green { color: var(--green); }
  .stat-val.orange { color: var(--orange); }
  .stat-val.red { color: var(--red); }
  .stat-label { font-size: 9px; color: var(--muted); margin-top: 3px; letter-spacing: 1px; text-transform: uppercase; }

  /* SEARCH + FILTERS */
  .controls { display: flex; flex-direction: column; gap: 8px; }
  .search-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 14px; font-family: 'DM Mono', monospace;
    font-size: 12px; color: var(--text); width: 100%; outline: none;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--muted); }
  .tabs { display: flex; gap: 4px; }
  .tab {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 11px; cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: white; }
  .filters { display: flex; gap: 4px; flex-wrap: wrap; }
  .filter-btn {
    padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border);
    background: none; color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 10px; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px;
  }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,0.1); }

  /* MAIN */
  main { padding: 16px; display: flex; flex-direction: column; gap: 10px; }

  /* LOADING */
  .loading {
    text-align: center; padding: 60px 20px; color: var(--muted);
    font-size: 12px; letter-spacing: 2px;
  }
  .loading-spinner {
    width: 32px; height: 32px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* CARDS */
  .card {
    border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
  }
  .card:hover { border-color: #2a3040; transform: translateY(-1px); }
  .card.done { border-color: var(--done-border); background: var(--done-bg); }
  .card.blocked { border-color: var(--blocked-border); }

  .card-header {
    padding: 14px 16px; cursor: pointer;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .card-icon {
    font-size: 18px; margin-top: 1px; flex-shrink: 0;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-title {
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
    color: var(--text); margin-bottom: 6px; line-height: 1.3;
  }
  .card-meta {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;
  }
  .badge {
    font-size: 9px; padding: 2px 8px; border-radius: 20px;
    letter-spacing: 0.5px; text-transform: uppercase; font-weight: 500;
    border: 1px solid;
  }
  .badge.done { color: var(--green); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.1); }
  .badge.pending { color: var(--accent); border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.1); }
  .badge.blocked { color: var(--red); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.1); }
  .badge.alert { color: var(--orange); border-color: rgba(249,115,22,0.3); background: rgba(249,115,22,0.1); }
  .badge.overdue { color: var(--red); border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.15); }

  .dates { display: flex; gap: 12px; font-size: 10px; color: var(--muted); margin-bottom: 8px; }
  .dates span { display: flex; align-items: center; gap: 4px; }

  /* PROGRESS */
  .progress-wrap { display: flex; align-items: center; gap: 8px; }
  .progress-bar {
    flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 2px; transition: width 0.5s ease;
  }
  .progress-fill.low { background: var(--red); }
  .progress-fill.mid { background: var(--gold); }
  .progress-fill.high { background: var(--green); }
  .progress-text { font-size: 10px; color: var(--muted); white-space: nowrap; }

  .chevron {
    font-size: 14px; color: var(--muted); transition: transform 0.2s; flex-shrink: 0;
    margin-top: 2px;
  }
  .chevron.open { transform: rotate(180deg); }

  /* SUBTASKS */
  .subtasks {
    border-top: 1px solid var(--border); padding: 10px 16px 14px;
    display: none;
  }
  .subtasks.open { display: block; }
  .subtask-label {
    font-size: 9px; color: var(--muted); letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .subtask {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 7px 0; border-bottom: 1px solid rgba(30,35,48,0.5);
    cursor: pointer; transition: opacity 0.1s;
  }
  .subtask:last-child { border-bottom: none; }
  .subtask:hover { opacity: 0.85; }
  .check {
    width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid var(--muted); display: flex; align-items: center;
    justify-content: center; margin-top: 1px; transition: all 0.2s;
  }
  .check.done { background: var(--green); border-color: var(--green); }
  .check.done::after { content: '✓'; font-size: 9px; color: white; }
  .subtask-text {
    font-size: 12px; color: var(--text); line-height: 1.4;
    transition: all 0.2s;
  }
  .subtask-text.done { color: var(--muted); text-decoration: line-through; }

  /* EMPTY */
  .empty {
    text-align: center; padding: 50px; color: var(--muted); font-size: 12px;
    letter-spacing: 1px;
  }

  /* FOOTER */
  footer {
    text-align: center; padding: 20px; font-size: 10px; color: var(--muted);
    letter-spacing: 1px; border-top: 1px solid var(--border); margin-top: 10px;
  }
  footer a { color: var(--accent); text-decoration: none; }

  /* SYNC BTN */
  .sync-btn {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted); font-family: 'DM Mono', monospace; font-size: 10px;
    padding: 5px 10px; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px;
  }
  .sync-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <div class="header-label">Coordinador SST — UNIQUE S.A.</div>
      <div class="header-title">🤖 Proyectos <span>IA</span></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>EN LÍNEA</span>
      </div>
      <button class="sync-btn" onclick="loadData()">↻ SYNC</button>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><div class="stat-val blue" id="s-total">—</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-val blue" id="s-pending">—</div><div class="stat-label">En curso</div></div>
    <div class="stat"><div class="stat-val green" id="s-done">—</div><div class="stat-label">Completados</div></div>
    <div class="stat"><div class="stat-val red" id="s-alerts">—</div><div class="stat-label">Alertas</div></div>
  </div>

  <div class="controls">
    <input class="search-box" id="search" placeholder="🔍 buscar proyecto..." oninput="render()" />
    <div class="tabs">
      <button class="tab active" id="tab-pending" onclick="setTab('pending')">🔄 En curso</button>
      <button class="tab" id="tab-done" onclick="setTab('done')">✅ Completados</button>
    </div>
    <div class="filters" id="filters-pending">
      <button class="filter-btn active" onclick="setFilter('all',this)">Todos</button>
      <button class="filter-btn" onclick="setFilter('alert',this)">⚠️ Alertas</button>
      <button class="filter-btn" onclick="setFilter('blocked',this)">🔴 Bloqueados</button>
    </div>
  </div>
</header>

<main id="main">
  <div class="loading">
    <div class="loading-spinner"></div>
    CARGANDO DATOS...
  </div>
</main>

<footer>
  Marcos Cavalier Jara · UNIQUE S.A. · Lima, Perú ·
  <a href="https://docs.google.com/spreadsheets/d/1PqwctL-IfxsQfZtZsUmqLHoj5tipl0GNWIMKZfVCm00" target="_blank">📊 Ver Sheet</a>
</footer>

<script>
const SHEET_ID = '1PqwctL-IfxsQfZtZsUmqLHoj5tipl0GNWIMKZfVCm00';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;

let allProjects = {};
let currentTab = 'pending';
let currentFilter = 'all';

async function loadData() {
  document.getElementById('main').innerHTML = `
    <div class="loading">
      <div class="loading-spinner"></div>
      SINCRONIZANDO CON GOOGLE SHEETS...
    </div>`;
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('No se pudo acceder al Sheet');
    const csv = await res.text();
    parseCSV(csv);
    render();
  } catch(e) {
    document.getElementById('main').innerHTML = `
      <div class="empty">
        ⚠️ No se pudo cargar el Sheet.<br><br>
        <span style="font-size:10px;color:#475569">
          Asegúrate que el Sheet sea público (Compartir → Cualquier persona con el enlace → Lector).<br><br>
          <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}" target="_blank" style="color:#3b82f6">Abrir Sheet →</a>
        </span>
      </div>`;
  }
}

function parseCSV(csv) {
  const lines = csv.trim().split('\n').slice(1);
  allProjects = {};
  lines.forEach(line => {
    const cols = parseCSVLine(line);
    if (cols.length < 6) return;
    const [id, grupo, proyecto, subtarea, estadoSub, estadoProj, fechaEntrega, fechaAlerta, notas] = cols;
    if (!allProjects[id]) {
      allProjects[id] = {
        id, grupo: grupo.trim(), title: proyecto.trim(),
        status: estadoProj.trim(), due: fechaEntrega?.trim() || '',
        alert: fechaAlerta?.trim() || '', subtasks: []
      };
    }
    if (subtarea.trim()) {
      allProjects[id].subtasks.push({
        text: subtarea.trim(),
        done: estadoSub.trim().toLowerCase() === 'hecho'
      });
    }
  });
}

function parseCSVLine(line) {
  const result = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') { inQ = !inQ; }
    else if (line[i] === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += line[i]; }
  }
  result.push(cur);
  return result;
}

function isAlertSoon(alert) {
  if (!alert) return false;
  const diff = (new Date(alert) - new Date()) / 86400000;
  return diff >= 0 && diff <= 7;
}
function isOverdue(due) {
  if (!due) return false;
  return new Date(due) < new Date();
}
function fmtDate(d) {
  if (!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function progress(subtasks) {
  const done = subtasks.filter(s => s.done).length;
  const total = subtasks.length;
  return { done, total, pct: total ? Math.round(done/total*100) : 0 };
}
function progressClass(pct) {
  if (pct < 40) return 'low';
  if (pct < 75) return 'mid';
  return 'high';
}

function setTab(tab) {
  currentTab = tab;
  document.getElementById('tab-pending').classList.toggle('active', tab === 'pending');
  document.getElementById('tab-done').classList.toggle('active', tab === 'done');
  document.getElementById('filters-pending').style.display = tab === 'pending' ? 'flex' : 'none';
  render();
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const projects = Object.values(allProjects);

  // Stats
  const pending = projects.filter(p => p.grupo.toUpperCase() === 'PENDIENTE');
  const done = projects.filter(p => p.grupo.toUpperCase() === 'COMPLETADO');
  const alerts = pending.filter(p => isAlertSoon(p.alert) || isOverdue(p.due));
  document.getElementById('s-total').textContent = projects.length;
  document.getElementById('s-pending').textContent = pending.length;
  document.getElementById('s-done').textContent = done.length;
  document.getElementById('s-alerts').textContent = alerts.length;

  // Filter
  let list = currentTab === 'pending' ? pending : done;
  if (search) list = list.filter(p => p.title.toLowerCase().includes(search));
  if (currentTab === 'pending') {
    if (currentFilter === 'alert') list = list.filter(p => isAlertSoon(p.alert) || isOverdue(p.due));
    if (currentFilter === 'blocked') list = list.filter(p => p.status.toLowerCase().includes('bloqueado'));
  }

  if (!list.length) {
    document.getElementById('main').innerHTML = `<div class="empty">— SIN RESULTADOS —</div>`;
    return;
  }

  document.getElementById('main').innerHTML = list.map(p => cardHTML(p)).join('');
}

function cardHTML(p) {
  const { done, total, pct } = progress(p.subtasks);
  const over = isOverdue(p.due);
  const alert = isAlertSoon(p.alert);
  const isBlocked = p.status.toLowerCase().includes('bloqueado');
  const isDone = p.grupo.toUpperCase() === 'COMPLETADO';
  const cardClass = isDone ? 'done' : isBlocked ? 'blocked' : '';

  const icon = isDone ? '✅' : isBlocked ? '🔴' : '🔄';

  const subtasksHTML = p.subtasks.map((s, i) => `
    <div class="subtask" onclick="toggleSub('${p.id}',${i})">
      <div class="check ${s.done ? 'done' : ''}"></div>
      <div class="subtask-text ${s.done ? 'done' : ''}">${s.text}</div>
    </div>
  `).join('');

  return `
  <div class="card ${cardClass}" id="card-${p.id}">
    <div class="card-header" onclick="toggleCard('${p.id}')">
      <div class="card-icon">${icon}</div>
      <div class="card-body">
        <div class="card-title">${p.title}</div>
        <div class="card-meta">
          ${isDone ? '<span class="badge done">Completado</span>' : isBlocked ? '<span class="badge blocked">Bloqueado</span>' : '<span class="badge pending">En curso</span>'}
          ${over ? '<span class="badge overdue">⚠️ Vencido</span>' : ''}
          ${alert && !over ? '<span class="badge alert">🔔 Alerta</span>' : ''}
        </div>
        ${(p.due || p.alert) ? `
        <div class="dates">
          ${p.due ? `<span>📅 ${fmtDate(p.due)}</span>` : ''}
          ${p.alert ? `<span>🔔 ${fmtDate(p.alert)}</span>` : ''}
        </div>` : ''}
        <div class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill ${progressClass(pct)}" style="width:${pct}%"></div>
          </div>
          <div class="progress-text">${done}/${total} (${pct}%)</div>
        </div>
      </div>
      <div class="chevron" id="chev-${p.id}">⌄</div>
    </div>
    <div class="subtasks" id="sub-${p.id}">
      <div class="subtask-label">SUBTAREAS</div>
      ${subtasksHTML}
    </div>
  </div>`;
}

function toggleCard(id) {
  const sub = document.getElementById(`sub-${id}`);
  const chev = document.getElementById(`chev-${id}`);
  sub.classList.toggle('open');
  chev.classList.toggle('open');
}

function toggleSub(projectId, subIdx) {
  const p = allProjects[projectId];
  if (!p) return;
  p.subtasks[subIdx].done = !p.subtasks[subIdx].done;
  // Re-render solo la card
  const card = document.getElementById(`card-${projectId}`);
  if (card) {
    const tmp = document.createElement('div');
    tmp.innerHTML = cardHTML(p);
    const newCard = tmp.firstElementChild;
    // Mantener estado expandido
    const wasOpen = document.getElementById(`sub-${projectId}`)?.classList.contains('open');
    card.replaceWith(newCard);
    if (wasOpen) {
      document.getElementById(`sub-${projectId}`)?.classList.add('open');
      document.getElementById(`chev-${projectId}`)?.classList.add('open');
    }
    // Re-update stats
    render();
  }
}

// Init
loadData();
</script>
</body>
</html>
